  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 7.4\nLicense: GNU General Public License v2 or later\nLicense URI: https://www.gnu.org/licenses/gpl-2.0.html\nText Domain: kitma-studio\nTags: one-column, custom-menu, custom-logo, editor-style, block-styles, wide-blocks, translation-ready\n*/\n\n/* ---------------------------------------------------------------\n   1. Fonts\n   Mobrak and Great are licensed display faces supplied by Kitma\n   Tech and are served from the theme's assets/fonts directory.\n   Public Sans is loaded from Google Fonts in functions.php.\n   --------------------------------------------------------------- */\n\n@font-face {\n\tfont-family: \"Mobrak\";\n\tsrc: url(\"2ef1a1a0-2488-4c3b-a3ad-c2eec470243f\") format(\"truetype\");\n\tfont-weight: 400;\n\tfont-style: normal;\n\tfont-display: swap;\n}\n\n@font-face {\n\tfont-family: \"Great\";\n\tsrc: url(\"5977b556-09e7-4dd1-a630-d03f23015669\") format(\"woff2\"),\n\t\turl(\"e1ec6814-688b-4fd7-b0be-64b684352c9e\") format(\"woff\");\n\tfont-weight: 400;\n\tfont-style: normal;\n\tfont-display: swap;\n}\n\n/* ---------------------------------------------------------------\n   2. Tokens\n   --------------------------------------------------------------- */\n\n:root {\n\t--k-bg: #ffffff;\n\t--k-ink: #000000;\n\t--k-body: #333333;\n\t--k-muted: #4a4a4a;\n\t--k-muted-2: #5e5e5e;\n\t--k-rule: #e0e0e0;\n\t--k-border: #e8e8e8;\n\t--k-surface: #f4f4f4;\n\t--k-row: #f7f7f7;\n\t--k-hair: #ececec;\n\t--k-dim: #d2d2d2;\n\t--k-tag: #ededed;\n\n\t--k-teal: #00a5b4;\n\t--k-teal: oklch(0.70 0.115 195);\n\t--k-teal-strong: #3cc2cd;\n\t--k-teal-strong: oklch(0.78 0.100 195);\n\t--k-teal-text: #56ccd6;\n\t--k-teal-text: oklch(0.82 0.090 195);\n\t--k-green: #0b3a3e;\n\t--k-green: oklch(0.32 0.055 195);\n\t--k-green-dark: #082f33;\n\t--k-green-dark: oklch(0.26 0.050 195);\n\t--k-on-green: #ffffff;\n\n\t--k-font-body: \"Public Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n\t--k-font-display: \"Great\", \"Iowan Old Style\", Georgia, serif;\n\t--k-font-label: \"Mobrak\", \"Public Sans\", Helvetica, Arial, sans-serif;\n\t--k-font-mono: \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n\t--k-shell: 1180px;\n\t--k-pad: 33.6px;\n\t--k-radius: 8px;\n}\n\n/* ---------------------------------------------------------------\n   3. Reset and base\n   --------------------------------------------------------------- */\n\n*,\n*::before,\n*::after {\n\tbox-sizing: border-box;\n}\n\nhtml {\n\t-webkit-text-size-adjust: 100%;\n}\n\nbody {\n\tmargin: 0;\n\tbackground: var(--k-bg);\n\tcolor: var(--k-ink);\n\tfont-family: var(--k-font-body);\n\tfont-size: 15px;\n\tline-height: 1.55;\n\t-webkit-font-smoothing: antialiased;\n\ttext-rendering: optimizeLegibility;\n}\n\nimg,\nsvg {\n\tmax-width: 100%;\n\theight: auto;\n\tdisplay: block;\n}\n\na {\n\tcolor: var(--k-ink);\n\ttext-decoration: none;\n\ttext-underline-offset: 3px;\n}\n\na:hover,\na:focus {\n\tcolor: var(--k-ink);\n\ttext-decoration: underline;\n}\n\n:focus-visible {\n\toutline: 2px solid var(--k-teal);\n\toutline-offset: 2px;\n}\n\n::selection {\n\tbackground: color-mix(in oklab, var(--k-teal) 22%, transparent);\n}\n\np {\n\tmargin: 0;\n\ttext-wrap: pretty;\n}\n\nh1,\nh2,\nh3,\nh4 {\n\tmargin: 0;\n\tfont-weight: 400;\n\tfont-family: var(--k-font-display);\n\tline-height: 1.1;\n\tletter-spacing: -0.005em;\n}\n\n.k-skip {\n\tposition: absolute;\n\tleft: -9999px;\n}\n\n.k-skip:focus {\n\tleft: 16px;\n\ttop: 16px;\n\tz-index: 99;\n\tbackground: var(--k-bg);\n\tpadding: 10px 16px;\n\tborder: 1px solid var(--k-ink);\n\tborder-radius: var(--k-radius);\n}\n\n.k-screen-reader-text {\n\tposition: absolute;\n\twidth: 1px;\n\theight: 1px;\n\toverflow: hidden;\n\tclip: rect(1px, 1px, 1px, 1px);\n\twhite-space: nowrap;\n}\n\n/* ---------------------------------------------------------------\n   4. Layout primitives\n   --------------------------------------------------------------- */\n\n.k-shell {\n\twidth: 100%;\n\tmax-width: var(--k-shell);\n\tmargin: 0 auto;\n\tpadding-left: var(--k-pad);\n\tpadding-right: var(--k-pad);\n}\n\n.k-section {\n\tpadding-top: 56px;\n\tpadding-bottom: 56px;\n}\n\n.k-rule {\n\theight: 1px;\n\tbackground: linear-gradient(\n\t\tto right,\n\t\ttransparent,\n\t\tvar(--k-rule) 48px,\n\t\tvar(--k-rule) calc(100% - 48px),\n\t\ttransparent\n\t);\n}\n\n.k-kicker {\n\tfont-family: var(--k-font-label);\n\tfont-size: 13px;\n\tletter-spacing: 0.24em;\n\tcolor: var(--k-green);\n\ttext-transform: uppercase;\n}\n\n.k-lede {\n\tfont-size: clamp(15px, 1.5vw, 17px);\n\tline-height: 1.6;\n\tcolor: var(--k-body);\n\tmax-width: 54ch;\n}\n\n.k-meta {\n\tfont-family: var(--k-font-mono);\n\tfont-size: 11px;\n\tcolor: var(--k-muted-2);\n}\n\n/* ---------------------------------------------------------------\n   5. Buttons\n   --------------------------------------------------------------- */\n\n.k-btn {\n\tdisplay: inline-block;\n\tfont-family: var(--k-font-body);\n\tfont-size: 15px;\n\tfont-weight: 500;\n\tpadding: 11.2px 22.4px;\n\tborder-radius: var(--k-radius);\n\tborder: 1px solid var(--k-teal);\n\tcolor: var(--k-ink);\n\tbackground: transparent;\n\tcursor: pointer;\n\ttransition: background-color 120ms ease, color 120ms ease;\n}\n\n.k-btn:hover,\n.k-btn:focus {\n\tbackground: var(--k-green);\n\tborder-color: var(--k-green);\n\tcolor: var(--k-on-green);\n\ttext-decoration: none;\n}\n\n.k-btn:active {\n\tbackground: var(--k-green-dark);\n\tborder-color: var(--k-green-dark);\n}\n\n.k-btn-solid {\n\tbackground: var(--k-green);\n\tborder-color: var(--k-green);\n\tcolor: var(--k-on-green);\n}\n\n.k-btn-solid:hover,\n.k-btn-solid:focus {\n\tbackground: var(--k-green-dark);\n\tborder-color: var(--k-green-dark);\n\tcolor: var(--k-on-green);\n}\n\n.k-btn-quiet {\n\tborder-color: var(--k-rule);\n\tcolor: var(--k-body);\n}\n\n.k-btn-quiet:hover,\n.k-btn-quiet:focus {\n\tbackground: var(--k-surface);\n\tborder-color: var(--k-dim);\n\tcolor: var(--k-ink);\n}\n\n.k-btn-sm {\n\tfont-size: 14px;\n\tpadding: 6.6px 14px;\n}\n\n/* ---------------------------------------------------------------\n   6. Header\n   --------------------------------------------------------------- */\n\n.k-header {\n\tborder-bottom: 1px solid var(--k-border);\n\tbackground: var(--k-bg);\n}\n\n.k-nav {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 22.4px;\n\trow-gap: 11.2px;\n\tpadding-top: 22.4px;\n\tpadding-bottom: 22.4px;\n}\n\n.k-brand {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 11.2px;\n}\n\n.k-brand:hover,\n.k-brand:focus {\n\ttext-decoration: none;\n}\n\n.k-brand img {\n\twidth: 34px;\n\theight: 34px;\n}\n\n.k-brand-name {\n\tfont-family: var(--k-font-label);\n\tfont-size: 21px;\n\tletter-spacing: 0.08em;\n\tline-height: 1;\n}\n\n.k-brand-sub {\n\tfont-family: var(--k-font-display);\n\tfont-size: 19px;\n\tline-height: 1;\n\tcolor: var(--k-muted);\n}\n\n.k-nav-right {\n\tmargin-left: auto;\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 22.4px;\n\trow-gap: 11.2px;\n}\n\n.k-menu {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\talign-items: center;\n\tgap: 22.4px;\n\trow-gap: 8px;\n\tlist-style: none;\n\tmargin: 0;\n\tpadding: 0;\n}\n\n.k-menu a {\n\tfont-size: 14px;\n\tcolor: var(--k-muted);\n}\n\n.k-menu a:hover,\n.k-menu a:focus {\n\tcolor: var(--k-ink);\n\ttext-decoration: none;\n\tborder-bottom: 1px solid var(--k-teal);\n}\n\n.k-menu .current-menu-item > a {\n\tcolor: var(--k-ink);\n\tborder-bottom: 1px solid var(--k-teal);\n}\n\n/* ---------------------------------------------------------------\n   7. Hero\n   --------------------------------------------------------------- */\n\n.k-hero {\n\tpadding-top: 56px;\n\tpadding-bottom: 44.8px;\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(320px, 1fr));\n\tgap: 44.8px;\n\talign-items: end;\n}\n\n.k-hero-copy {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 16.8px;\n}\n\n.k-hero h1 {\n\tfont-size: clamp(40px, 6.4vw, 76px);\n\tline-height: 1.02;\n\ttext-wrap: balance;\n}\n\n.k-actions {\n\tdisplay: flex;\n\tflex-wrap: wrap;\n\tgap: 11.2px;\n\tpadding-top: 5.6px;\n}\n\n/* ---------------------------------------------------------------\n   8. Panels (hero transcript, node lists)\n   --------------------------------------------------------------- */\n\n.k-panel {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 11.2px;\n\tbackground: var(--k-bg);\n\tborder: 1px solid var(--k-border);\n\tborder-radius: var(--k-radius);\n\tpadding: 16.8px;\n}\n\n.k-panel-head {\n\tdisplay: flex;\n\tjustify-content: space-between;\n\talign-items: baseline;\n\tgap: 11.2px;\n}\n\n.k-panel-title {\n\tfont-family: var(--k-font-label);\n\tfont-size: 13px;\n\tletter-spacing: 0.16em;\n}\n\n.k-panel-hair {\n\theight: 1px;\n\tbackground: var(--k-hair);\n}\n\n.k-turn {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 2.8px;\n\tpadding: 8.4px 11.2px;\n\tborder-radius: 4px;\n\tbackground: var(--k-row);\n}\n\n.k-turn-who {\n\tfont-family: var(--k-font-mono);\n\tfont-size: 10px;\n\tletter-spacing: 0.08em;\n\ttext-transform: uppercase;\n\tcolor: var(--k-muted-2);\n}\n\n.k-turn-said {\n\tfont-size: 14px;\n\tline-height: 1.5;\n\tcolor: var(--k-body);\n}\n\n.k-turn-studio {\n\tbackground: color-mix(in oklab, var(--k-teal) 8%, var(--k-bg));\n\tborder-left: 2px solid var(--k-teal);\n}\n\n.k-nodes {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 5.6px;\n}\n\n.k-node {\n\tdisplay: flex;\n\talign-items: center;\n\tgap: 11.2px;\n\tpadding: 8.4px 11.2px;\n\tborder-radius: 4px;\n\tbackground: var(--k-row);\n\tborder-left: 2px solid var(--k-dim);\n}\n\n.k-node-live {\n\tborder-left-color: var(--k-teal);\n}\n\n.k-node-name {\n\tfont-size: 14px;\n\tflex: 1 1 auto;\n}\n\n.k-tag {\n\tfont-size: 11px;\n\tfont-weight: 600;\n\tpadding: 1.4px 7px;\n\tborder-radius: 4px;\n\tbackground: var(--k-tag);\n\tcolor: var(--k-body);\n\twhite-space: nowrap;\n}\n\n.k-tag-live {\n\tbackground: var(--k-teal);\n\tcolor: #0d2426;\n}\n\n/* ---------------------------------------------------------------\n   9. Numbered and plain card grids\n   --------------------------------------------------------------- */\n\n.k-grid {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(260px, 1fr));\n\tgap: 33.6px;\n}\n\n.k-grid-tight {\n\tgap: 22.4px;\n}\n\n.k-item {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 8.4px;\n\tborder-top: 1px solid var(--k-teal);\n\tpadding-top: 16.8px;\n}\n\n.k-item h3 {\n\tfont-size: 27px;\n\tline-height: 1.15;\n}\n\n.k-item p {\n\tcolor: var(--k-body);\n\tline-height: 1.6;\n}\n\n.k-index {\n\tfont-family: var(--k-font-mono);\n\tfont-size: 11px;\n\tcolor: var(--k-muted-2);\n}\n\n.k-head {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 8.4px;\n\tmax-width: 58ch;\n\tmargin-bottom: 33.6px;\n}\n\n.k-head h2 {\n\tfont-size: clamp(30px, 4.2vw, 44px);\n\tline-height: 1.08;\n}\n\n/* ---------------------------------------------------------------\n   10. Green band\n   --------------------------------------------------------------- */\n\n.k-band {\n\tbackground: var(--k-green);\n\tcolor: var(--k-on-green);\n}\n\n.k-band-inner {\n\tpadding-top: 56px;\n\tpadding-bottom: 56px;\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n\tgap: 33.6px;\n\talign-items: start;\n}\n\n.k-stat {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 5.6px;\n}\n\n.k-stat-figure {\n\tfont-family: var(--k-font-display);\n\tfont-size: clamp(36px, 4.6vw, 52px);\n\tline-height: 1;\n}\n\n.k-stat-label {\n\tfont-family: var(--k-font-label);\n\tfont-size: 12px;\n\tletter-spacing: 0.2em;\n\tcolor: color-mix(in oklab, var(--k-on-green) 78%, var(--k-green));\n\ttext-transform: uppercase;\n}\n\n/* ---------------------------------------------------------------\n   11. Surfaces, checklist, editions\n   --------------------------------------------------------------- */\n\n.k-split {\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n\tgap: 33.6px;\n\talign-items: start;\n}\n\n.k-list {\n\tlist-style: none;\n\tmargin: 0;\n\ in\">\n\n<section class=\"k-shell k-hero\" id=\"top\">\n\t<div class=\"k-hero-copy\">\n\t\t<span class=\"k-kicker\">AI AGENT BUILDER FOR 1-500 STAFF BUSINESSES<\u002Fspan>\n\t\t<h1>Your team describes the work. Kitma Studio builds the agent.<\u002Fh1>\n\t\t<p class=\"k-lede\">One AI surface for everyone in the business: conversation, web search, and native Excel, Word, Outlook, browser, desktop and mobile access. Describe a repetitive job in plain language and Kitma Studio asks the right questions, proposes a solution, then builds the agents, workflows, tools and knowledge base behind it.<\u002Fp>\n\t\t<div class=\"k-actions\">\n\t\t\t<a class=\"k-btn\" href=\"#start\">Book a walkthrough<\u002Fa>\n\t\t\t<a class=\"k-btn k-btn-quiet\" href=\"#how\">See how it builds<\u002Fa>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n\n\t<div class=\"k-panel\">\n\t\t<div class=\"k-panel-head\">\n\t\t\t<span class=\"k-panel-title\">NEW AUTOMATION<\u002Fspan>\n\t\t\t<span class=\"k-meta\">in conversation<\u002Fspan>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-panel-hair\"><\u002Fdiv>\n\n\t\t<div class=\"k-turn\">\n\t\t\t<span class=\"k-turn-who\">Priya, accounts<\u002Fspan>\n\t\t\t<span class=\"k-turn-said\">Every Monday I pull last week’s invoices, check them against the PO sheet, and email the exceptions to Anna.<\u002Fspan>\n\t\t<\u002Fdiv>\n\n\t\t<div class=\"k-turn k-turn-studio\">\n\t\t\t<span class=\"k-turn-who\">Kitma Studio<\u002Fspan>\n\t\t\t<span class=\"k-turn-said\">I can build that. Two questions: which PO sheet is authoritative, and should the exception email wait for your approval before it sends?<\u002Fspan>\n\t\t<\u002Fdiv>\n\n\t\t<div class=\"k-panel-hair\"><\u002Fdiv>\n\n\t\t<div class=\"k-panel-head\">\n\t\t\t<span class=\"k-panel-title\">WHAT IT BUILT<\u002Fspan>\n\t\t\t<span class=\"k-meta\">runs Mondays, 07:00<\u002Fspan>\n\t\t<\u002Fdiv>\n\n\t\t<div class=\"k-nodes\">\n\t\t\t<div class=\"k-node k-node-live\">\n\t\t\t\t<span class=\"k-node-name\">Fetch invoices<\u002Fspan>\n\t\t\t\t<span class=\"k-meta\">1.2s<\u002Fspan>\n\t\t\t\t<span class=\"k-tag k-tag-live\">running<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t\t<div class=\"k-node\">\n\t\t\t\t<span class=\"k-node-name\">Match against PO sheet<\u002Fspan>\n\t\t\t\t<span class=\"k-meta\">0.4s<\u002Fspan>\n\t\t\t\t<span class=\"k-tag\">queued<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t\t<div class=\"k-node\">\n\t\t\t\t<span class=\"k-node-name\">Email exceptions to Anna<\u002Fspan>\n\t\t\t\t<span class=\"k-meta\">—<\u002Fspan>\n\t\t\t\t<span class=\"k-tag\">needs approval<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t<\u002Fdiv>\n\n\t\t<span class=\"k-meta\">every step keeps a signed, readable trace<\u002Fspan>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"k-shell\"><div class=\"k-rule\"><\u002Fdiv><\u002Fdiv>\n\n<section class=\"k-shell k-section\" id=\"why\">\n\t<div class=\"k-head\">\n\t\t<span class=\"k-kicker\">WHY IT EXISTS<\u002Fspan>\n\t\t<h2>Four problems every growing business already has<\u002Fh2>\n\t<\u002Fdiv>\n\n\t<div class=\"k-grid\">\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">01<\u002Fspan>\n\t\t\t<h3>Ungoverned AI spend<\u002Fh3>\n\t\t\t<p>Staff sign up for their own AI tools with no oversight, so the business pays several times over for the same capability and cannot see who is using what, or why.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">02<\u002Fspan>\n\t\t\t<h3>Company data walking out<\u002Fh3>\n\t\t\t<p>Work done in personal accounts leaves your control entirely: no audit trail, no redaction, no residency guarantee. That is a material risk in any regulated market.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">03<\u002Fspan>\n\t\t\t<h3>No path to automation<\u002Fh3>\n\t\t\t<p>Your staff know their repetitive work in detail but cannot automate it without a developer. Kitma Studio gives them that directly, in conversation.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">04<\u002Fspan>\n\t\t\t<h3>Paying twice regardless<\u002Fh3>\n\t\t\t<p>Buy an agent builder today and you still buy a general AI tool alongside it. Kitma Studio covers both, so there is no second subscription to approve.<\u002Fp>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"k-band\">\n\t<div class=\"k-shell k-band-inner\">\n\t\t<div class=\"k-stat\">\n\t\t\t<span class=\"k-stat-figure\">1-500<\u002Fspan>\n\t\t\t<span class=\"k-stat-label\">STAFF: THE BUSINESSES WE BUILD FOR<\u002Fspan>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-stat\">\n\t\t\t<span class=\"k-stat-figure\">One tool<\u002Fspan>\n\t\t\t<span class=\"k-stat-label\">REPLACES THE AI SUBSCRIPTIONS STAFF BUY THEMSELVES<\u002Fspan>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-stat\">\n\t\t\t<span class=\"k-stat-figure\">Two editions<\u002Fspan>\n\t\t\t<span class=\"k-stat-label\">MANAGED SAAS OR SELF-HOSTED LICENCE<\u002Fspan>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"k-shell k-section\" id=\"how\">\n\t<div class=\"k-head\">\n\t\t<span class=\"k-kicker\">HOW IT WORKS<\u002Fspan>\n\t\t<h2>Three steps, none of them technical<\u002Fh2>\n\t<\u002Fdiv>\n\n\t<div class=\"k-grid\">\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">01<\u002Fspan>\n\t\t\t<h3>Describe the job<\u002Fh3>\n\t\t\t<p>Say what you want in your own words. Kitma Studio asks the questions that matter and suggests which applications, databases and documents to combine.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">02<\u002Fspan>\n\t\t\t<h3>It proposes, reuses, builds<\u002Fh3>\n\t\t\t<p>Kitma Studio checks what your organisation already has, reuses it where it fits, and builds whatever is missing: agents, workflows, tools, skills, forms and knowledge base.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-item\">\n\t\t\t<span class=\"k-index\">03<\u002Fspan>\n\t\t\t<h3>Approve it, then it runs<\u002Fh3>\n\t\t\t<p>You set the schedule and approve the result. Items needing a human land in your inbox, and the reports and dashboards you are likely to want are drafted for you.<\u002Fp>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n\n\t<div class=\"k-split\" style=\"margin-top: 44.8px;\">\n\t\t<div class=\"k-hero-copy\">\n\t\t\t<span class=\"k-kicker\">THE BUILDER<\u002Fspan>\n\t\t\t<h2 style=\"font-size: clamp(28px, 3.8vw, 40px);\">One canvas, and the trace beside it<\u002Fh2>\n\t\t\t<p class=\"k-lede\">Your staff work in conversation; whoever signs off reads the same named steps in plain language. Nobody maintains a second diagram for the audit.<\u002Fp>\n\t\t<\u002Fdiv>\n\n\t\t<div class=\"k-mock\" role=\"img\" aria-label=\"The Kitma Studio builder: a workspace rail beside a named, step-by-step agent\">\n\t\t\t\t<div class=\"k-mock-bar\">\n\t\t\t\t\t<img src=\"91228184-350f-44d2-859a-240231ce9e5a\" alt=\"\" width=\"18\" height=\"18\">\n\t\t\t\t\t<span class=\"k-mock-bar-title\">WEEKLY INVOICE CHECK<\u002Fspan>\n\t\t\t\t\t<span class=\"k-meta\" style=\"margin-left: auto;\">staging<\u002Fspan>\n\t\t\t\t<\u002Fdiv>\n\t\t\t\t<div class=\"k-mock-body\">\n\t\t\t\t\t<div class=\"k-mock-rail\">\n\t\t\t\t\t\t<span class=\"k-mock-label\">Workspace<\u002Fspan>\n\t\t\t\t\t\t<span class=\"k-mock-item k-mock-item-on\">Agents · 4<\u002Fspan>\n\t\t\t\t\t\t<span class=\"k-mock-item\">Workflows · 7<\u002Fspan>\n\t\t\t\t\t\t<span class=\"k-mock-item\">Tools · 12<\u002Fspan>\n\t\t\t\t\t\t<span class=\"k-mock-item\">Knowledge · 3<\u002Fspan>\n\t\t\t\t\t\t<span class=\"k-mock-item\">Inbox · 2<\u002Fspan>\n\t\t\t\t\t<\u002Fdiv>\n\t\t\t\t\t<div class=\"k-mock-canvas\">\n\t\t\t\t\t\t<span class=\"k-mock-label\">Steps, in order<\u002Fspan>\n\t\t\t\t\t\t<div class=\"k-mock-step k-mock-step-live\">\n\t\t\t\t\t\t\t<span class=\"k-mock-index\">01<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-mock-step-name\">Fetch last week’s invoices<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-tag k-tag-live\">running<\u002Fspan>\n\t\t\t\t\t\t<\u002Fdiv>\n\t\t\t\t\t\t<div class=\"k-mock-wire\"><\u002Fdiv>\n\t\t\t\t\t\t<div class=\"k-mock-step\">\n\t\t\t\t\t\t\t<span class=\"k-mock-index\">02<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-mock-step-name\">Match against the PO sheet<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-tag\">queued<\u002Fspan>\n\t\t\t\t\t\t<\u002Fdiv>\n\t\t\t\t\t\t<div class=\"k-mock-wire\"><\u002Fdiv>\n\t\t\t\t\t\t<div class=\"k-mock-step\">\n\t\t\t\t\t\t\t<span class=\"k-mock-index\">03<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-mock-step-name\">Email exceptions to Anna<\u002Fspan>\n\t\t\t\t\t\t\t<span class=\"k-tag\">needs approval<\u002Fspan>\n\t\t\t\t\t\t<\u002Fdiv>\n\t\t\t\t\t\t<span class=\"k-meta\" style=\"margin-top: 5.6px;\">each step keeps its own signed trace<\u002Fspan>\n\t\t\t\t\t<\u002Fdiv>\n\t\t\t\t<\u002Fdiv>\n\t\t\t<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<div class=\"k-shell\"><div class=\"k-rule\"><\u002Fdiv><\u002Fdiv>\n\n<section class=\"k-shell k-section\" id=\"surfaces\">\n\t<div class=\"k-head\">\n\t\t<span class=\"k-kicker\">WHERE IT RUNS<\u002Fspan>\n\t\t<h2>In the applications your staff already have open<\u002Fh2>\n\t\t<p class=\"k-lede\">Kitma Studio is not a website your team has to remember to visit. It sits inside the tools they use all day, in their own language.<\u002Fp>\n\t<\u002Fdiv>\n\n\t<table class=\"k-table\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th colspan=\"2\">SURFACE<\u002Fth>\n\t\t\t\t<th>WHAT IT DOES THERE<\u002Fth>\n\t\t\t\t<th class=\"k-table-note\">AVAILABLE ON<\u002Fth>\n\t\t\t<\u002Ftr>\n\t\t<\u002Fthead>\n\t\t<tbody>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Web application<\u002Ftd>\n\t\t\t\t<td>The full builder, inbox and dashboards<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">any browser<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Desktop application<\u002Ftd>\n\t\t\t\t<td>Same as web, plus local files and offline drafts<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">Windows, macOS<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Mobile application<\u002Ftd>\n\t\t\t\t<td>Approvals and inbox on the move<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">iOS, Android<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Browser extensions<\u002Ftd>\n\t\t\t\t<td>Ask about, or act on, the page in front of you<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">Chrome, Edge, Firefox, Brave, Safari<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Excel and Word<\u002Ftd>\n\t\t\t\t<td>Draft, summarise and fill in the document itself<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">native add-ins<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t\t<tr>\n\t\t\t\t<td class=\"k-table-mark\">—<\u002Ftd>\n\t\t\t\t<td>Outlook<\u002Ftd>\n\t\t\t\t<td>Triage, reply and trigger an agent from a mail<\u002Ftd>\n\t\t\t\t<td class=\"k-table-note\">native add-in<\u002Ftd>\n\t\t\t<\u002Ftr>\n\t\t<\u002Ftbody>\n\t<\u002Ftable>\n<\u002Fsection>\n\n<section class=\"k-shell k-section\" id=\"control\">\n\t<div class=\"k-split\">\n\t\t<div class=\"k-hero-copy\">\n\t\t\t<span class=\"k-kicker\">CONTROL<\u002Fspan>\n\t\t\t<h2 style=\"font-size: clamp(30px, 4.2vw, 44px);\">Built for whoever has to answer for it<\u002Fh2>\n\t\t\t<p class=\"k-lede\">Governance is not a later module. Audit, visibility scoping, redaction and cost control are cross-cutting services that every agent runs through from day one.<\u002Fp>\n\t\t<\u002Fdiv>\n\n\t\t<ul class=\"k-list\" style=\"grid-template-columns: 1fr;\">\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Full audit trail, technical and in plain language<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Visibility scoped to your org, department and team structure<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Redaction controls before data reaches a model<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Seat and credit limits at any level, with live consumption<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Warnings to admins and users as a limit approaches<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Data residency provisions from day one, both editions<\u002Fspan><\u002Fli>\n\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span class=\"k-list-name\">Consolidated view of cost and return for the owner<\u002Fspan><\u002Fli>\n\t\t<\u002Ful>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"k-shell k-section\" id=\"editions\">\n\t<div class=\"k-head\">\n\t\t<span class=\"k-kicker\">EDITIONS<\u002Fspan>\n\t\t<h2>One codebase, two ways to run it<\u002Fh2>\n\t<\u002Fdiv>\n\n\t<div class=\"k-split\">\n\t\t<div class=\"k-edition k-edition-lead\">\n\t\t\t<span class=\"k-kicker\">MANAGED SAAS<\u002Fspan>\n\t\t\t<h3>Hosted by Kitma Tech<\u002Fh3>\n\t\t\t<ul>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Per-seat subscription as a predictable base, plus usage credits above the included allowance<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>A large provisioned model catalogue with a default router and caching layer; override the model when you want to<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Multi-tenant, pooled infrastructure<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Data residency available from day one<\u002Fspan><\u002Fli>\n\t\t\t<\u002Ful>\n\t\t<\u002Fdiv>\n\n\t\t<div class=\"k-edition\">\n\t\t\t<span class=\"k-kicker\">SELF-HOSTED<\u002Fspan>\n\t\t\t<h3>Annual licence, single tenant<\u002Fh3>\n\t\t\t<ul>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Three hosting options: Kitma Tech hosted, client hosted online, or client premises offline and air-gapped<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Connect your own model providers, routing and caching<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Runs on Windows and Linux server environments<\u002Fspan><\u002Fli>\n\t\t\t\t<li><span class=\"k-bullet\">—<\u002Fspan><span>Deployment assistance available; credits optional for internal chargeback<\u002Fspan><\u002Fli>\n\t\t\t<\u002Ful>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"k-shell\"><div class=\"k-rule\"><\u002Fdiv><\u002Fdiv>\n\n<section class=\"k-shell k-section\" id=\"company\">\n\t<span class=\"k-kicker\" style=\"display: block; margin-bottom: 22.4px;\">ONE HOUSE, THREE MARKS<\u002Fspan>\n\t<div class=\"k-marks\">\n\t\t<div class=\"k-mark\">\n\t\t\t<div class=\"k-mark-row\">\n\t\t\t\t<img src=\"45e03a3e-da5f-4569-becf-a6945eada068\" alt=\"\" width=\"30\" height=\"30\">\n\t\t\t\t<span class=\"k-mark-mobrak\">KITMA TECH<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t\t<p>The company. Incorporated in Singapore, building worldwide.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-mark\">\n\t\t\t<div class=\"k-mark-row\">\n\t\t\t\t<img src=\"91228184-350f-44d2-859a-240231ce9e5a\" alt=\"\" width=\"30\" height=\"30\">\n\t\t\t\t<span class=\"k-mark-mobrak\">KITMA AI<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t\t<p>The models, the router and the agent runtime underneath.<\u002Fp>\n\t\t<\u002Fdiv>\n\t\t<div class=\"k-mark\">\n\t\t\t<div class=\"k-mark-row\">\n\t\t\t\t<img src=\"45e03a3e-da5f-4569-becf-a6945eada068\" alt=\"\" width=\"30\" height=\"30\">\n\t\t\t\t<span class=\"k-mark-great\">Kitma Studio<\u002Fspan>\n\t\t\t<\u002Fdiv>\n\t\t\t<p>The product your staff open every morning.<\u002Fp>\n\t\t<\u002Fdiv>\n\t<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"k-shell\"><div class=\"k-rule\"><\u002Fdiv><\u002Fdiv>\n\n<section class=\"k-shell k-section\" id=\"contact\">\n\t<div clas
